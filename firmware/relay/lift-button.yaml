esphome:
  name: lift-button
  friendly_name: "Кнопка лифта"

esp8266:
  board: esp01_1m
  restore_from_flash: true

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  ap:
    ssid: "Lift Button Recovery"
    password: !secret fallback_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 2
  auth:
    username: !secret web_username
    password: !secret web_password

switch:
  - platform: gpio
    id: lift_relay
    pin: GPIO4
    internal: true
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: green_led
    pin: GPIO13
    internal: true
    restore_mode: ALWAYS_OFF

button:
  - platform: template
    id: lift_call
    name: "Вызвать лифт"
    icon: "mdi:elevator"
    on_press:
      - switch.turn_on: lift_relay
      - delay: 500ms
      - switch.turn_off: lift_relay

binary_sensor:
  - platform: gpio
    id: board_button
    internal: true
    pin:
      number: GPIO12
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      - button.press: lift_call
