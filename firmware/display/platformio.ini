[platformio]
default_envs = esp12f

[env:esp12f]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.filesystem = littlefs
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  knolleary/PubSubClient@^2.8
build_flags =
  -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
  -D USER_SETUP_LOADED=1
  -D ST7789_2_DRIVER=1
  -D TFT_RGB_ORDER=TFT_RGB
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=0
  -D TFT_RST=2
  -D TFT_BL=5
  -D TFT_BACKLIGHT_ON=LOW
  -D SPI_FREQUENCY=40000000
  -D LOAD_GLCD=1
  -D ENABLE_MQTT=1

[env:recovery]
extends = env:esp12f
build_flags =
  ${env:esp12f.build_flags}
  -D RECOVERY_BUILD

[env:network_safe]
extends = env:esp12f
build_flags =
  ${env:esp12f.build_flags}
  -D NETWORK_SAFE_BUILD
